# ============================================================================
# picom 13 (CachyOS build) - https://github.com/yshui/picom
#
# IMPORTANT - this build parses its config with libconfig, so the classic
# picom rule syntax does NOT work. Verified failures:
#
#     opacity-rule = 0.92:class="^kitty$";
#       ERROR: parse_numeric_prefix: Number separator (':') not found
#
# The rules actually accepted here are:
#     * opacity is an integer 0-100, NOT a 0.0-1.0 float
#     * conditions are single-quoted with no spaces around '='
#     * the condition keyword is class_g / window_type, not class / _NET_WM_WM_CLASS
#
# Rules are evaluated in order and the FIRST match wins, so the exclusions
# have to come before the general rules.
# ============================================================================

backend = "glx";
experimental-backends = true;

# ---------------------------------------------------------------------------
# Animations - OFF
# ---------------------------------------------------------------------------
# fading = false is what removes picom's fade in/out. This alone does NOT
# stop animation: i3 has its own independent 'animations' setting for
# window open/close, which is disabled separately in the i3 config.
fading = false;
fade-delta = 0;
fade-in-step = 0;
fade-out-step = 0;

# ---------------------------------------------------------------------------
# Transparency
# ---------------------------------------------------------------------------
# Only ordinary app windows and the terminal become translucent. Panels,
# docks, menus, tooltips and notifications are forced opaque so that system
# UI stays crisp and readable over a busy wallpaper.
opacity-rule = [
  "100:window_type='dock'",             # panels / dock
  "100:window_type='notification'",     # dunst
  "100:window_type='menu'",             # menus
  "100:window_type='dropdown_menu'",
  "100:window_type='popup_menu'",
  "100:window_type='utility'",
  "100:window_type='toolbar'",
  "100:window_type='splash'",
  "100:fullscreen",                     # games / video stay solid
  # kitty's own background_opacity is 1.0 and background_blur is 0, so picom
  # owns its transparency. It has to be matched by an explicit rule: kitty
  # never sets _NET_WM_WINDOW_OPACITY, it only draws alpha into its own
  # buffer, so without a matching rule the generic window_type='normal' rule
  # below would apply and no per-kitty tuning would be possible.
  "88:class_g='kitty'",                  # the terminal
  "92:window_type='normal'",            # ordinary app windows
];

# Client-side opacity (apps requesting their own translucency) is honoured,
# so Firefox et al can still dim themselves the normal way.
detect-client-opacity = true;

# ---------------------------------------------------------------------------
# Background blur
# ---------------------------------------------------------------------------
# dual_kawase is the cheapest of the blur methods, which matters on an
# Intel UHD 620. Only the window background is blurred, never the frame -
# blurring the frame is what produces the smudged titlebar edge.
blur: {
  method = "dual_kawase";
  strength = 8;
  deviation = 0.0;
  kernel = "11x11gaussian";
  background = true;
  background-frame = false;
  background-fixed = false;
  kern = "3x3box";
};

# GTK4/libadwaita and CSD apps draw their own frame into the client area,
# which picom cannot exclude by class - the frame extent atom check is what
# keeps those from picking up a blurred border.
blur-background-exclude = [
  "_GTK_FRAME_EXTENTS@",
];

# ---------------------------------------------------------------------------
# Corners
# ---------------------------------------------------------------------------
corner-radius = 12;
round-borders = 1;

# Fullscreen windows are excluded, otherwise rounded corners show as black
# notches in the corners of a fullscreen game.
rounded-corners-exclude = [
  "fullscreen",
  "class_g='Polybar'",
  "_GTK_FRAME_EXTENTS@",
];

# ---------------------------------------------------------------------------
# Damage / repaint - matters most on integrated graphics
# ---------------------------------------------------------------------------
# Render only the region that actually changed instead of recompositing the
# whole screen every frame.
use-damage = true;

# Let fullscreen apps bypass the compositor entirely where possible.
unredir-if-possible = true;
unredir-if-possible-delay = 0;
unredir-if-possible-exclude = [
  "class_g='Firefox'",
  "class_g='firefox'",
  "class_g='kitty'",
];

detect-transient = true;
detect-client-leader = true;
use-ewmh-active-win = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

vsync = true;

# ---------------------------------------------------------------------------
# Shadows
# ---------------------------------------------------------------------------
shadow = false;

# ---------------------------------------------------------------------------
# Fading per window type - belt and braces with fading = false above
# ---------------------------------------------------------------------------
wintypes:
{
  normal = { fade = false; shadow = false; };
  dock = { fade = false; shadow = false; opacity = 1.0; };
  notification = { fade = false; shadow = false; opacity = 1.0; };
  tooltip = { fade = false; shadow = false; opacity = 1.0; };
  menu = { fade = false; shadow = false; opacity = 1.0; };
  dropdown_menu = { fade = false; shadow = false; opacity = 1.0; };
  popup_menu = { fade = false; shadow = false; opacity = 1.0; };
};

log-level = "warn";
