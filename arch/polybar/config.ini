;==========================================================
;  Polybar - Single unified bar layout
;==========================================================

[colors]
bg = #cc2a2540
focus=#000000
fg = #e0aaff
accent = #9d4edd
accent2 = #c77dff
accent3 = #a6e3a1
warning = #ffb86c
critical = #ff6b6b
transparent = #00000000
inactive = #7a6a99
[bar/main]
monitor = ${env:MONITOR:}
; Centred floating bar on a 1920px-wide screen.
; 1600px wide -> offset-x must be (1920 - 1600) / 2 = 160 to centre it.
; NB: fixed-center below is a no-op in polybar 3.7.2, so offset-x does the centring.
; width must be < 100%, otherwise the right-hand rounded corners run off-screen.
width = 1600px
height = 32
radius = 8
offset-x = 160px
offset-y = 8px
background = ${colors.bg}
foreground = ${colors.fg}
border-size = 0
padding-left = 8
padding-right = 8
module-margin-left = 1
module-margin-right = 1
separator-foreground = ${colors.transparent}
override-redirect = true
wm-restack = i3
fixed-center = true
enable-ipc = true

; Fonts
; You have Font Awesome 7 installed, not FA5. FA5 names silently fall back to
; Noto Sans, which is why icons used to render as boxes.
;   font-1 = JetBrainsMono Nerd Font -> covers 8 of the 10 PUA glyphs below
;   font-2 = same, kept for the i3 layout-mode icon
;   font-3 = Font Awesome 7 Free     -> the only font with U+F538 (memory)
;                                        and U+F6A9 (muted); those two modules
;                                        are tagged %{T1} instead of %{T1}
font-0 = "JetBrainsMono Nerd Font:size=11;2"
font-1 = "JetBrainsMono Nerd Font:size=11;2"
font-2 = "JetBrainsMono Nerd Font:size=11;2"

; Module layout: left | center | right
modules-left = cpu memory cpu_temp
modules-center = i3
modules-right = date battery volume network

;================================================================
;  MODULES
;================================================================

;----- CPU Usage -----
[module/cpu]
type = internal/cpu
interval = 2
label =  " %{T1} %{T-}%percentage:2%%"
label-foreground = ${colors.fg}

;----- Memory (RAM) -----
[module/memory]
type = internal/memory
interval = 2
label =  " %{T1}  %{T-}%percentage_used:2%%"
label-foreground = ${colors.fg}

;----- CPU Temperature -----
[module/cpu_temp]
type = custom/script
exec = ~/.config/polybar/cpu_temp.sh
interval = 3
label =  " %{T1} %{T-}%output%"
label-foreground = ${colors.fg}

;----- Workspaces (i3) - CENTERED -----
[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
pin-workspaces = true

label-mode = "%{T2}%{T-} %mode%"
label-mode-foreground = ${colors.accent2}
label-mode-padding = 1

label-focused = %index%
label-focused-background = ${colors.accent}
label-focused-foreground = ${colors.focus}
label-focused-padding = 1
label-focused-margin = 2px

label-unfocused = %index%
label-unfocused-foreground = ${colors.inactive}
label-unfocused-padding = 1
label-unfocused-margin = 2px

label-visible = %index%
label-visible-foreground = ${colors.accent}
label-visible-padding = 1
label-visible-margin = 2px

label-urgent = %index%
label-urgent-background = ${colors.critical}
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 1
label-urgent-margin = 2px

;----- Date & Time -----
[module/date]
type = internal/date
interval = 1
; Requires an English locale: LC_TIME=ur_PK renders %p as Urdu, not AM/PM.
date = %d-%m-%Y
time = %I:%M %p
label = " %{T1}  %{T-}%date% %time% "
label-foreground = ${colors.fg}

;----- Battery -----
[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
interval = 5
label-charging = " %{T1} %{T-}%percentage%% "
label-charging-foreground = ${colors.accent3}
label-discharging = " %{T1} %{T-}%percentage%% "
label-discharging-foreground = ${colors.fg}
label-full = " %{T1}  %{T-}Full "
label-full-foreground = ${colors.accent3}

;----- Volume -----
[module/volume]
type = internal/pulseaudio
label-volume = " %{T1}  %{T-}%percentage%% "
label-volume-foreground = ${colors.fg}
label-muted = " %{T1}% {T-}"
label-muted-foreground = ${colors.warning}

;----- Network -----
[module/network]
type = custom/script
exec = ~/.config/polybar/net_status_simple.sh
interval = 3
label =  " %{T1}  %{T-}%output% "
label-foreground = ${colors.fg}

;================================================================
;  SETTINGS
;================================================================
[cursor]
click = pointer
scroll = ns-resize
